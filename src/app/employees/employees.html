<div class="toolbar">
  <button type="button" (click)="onAdd()">Add Employee</button>
  <app-logout></app-logout>
</div>

<table class="employeeTable">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Department</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    @for (employee of employees(); track employee.id) {
      <tr>
        <td>{{ employee.id }}</td>
        <td>{{ employee.name }}</td>
        <td>{{ employee.department }}</td>
        <td class="actions">
          <button type="button" (click)="onEdit(employee)">Edit</button>
          <button type="button" (click)="onDelete(employee)">Delete</button>
        </td>
      </tr>
    }
  </tbody>
</table>

@if (editingEmployee() || isAdding()) {
  <div class="modalOverlay">
    <div class="modal">
      <h2>{{ isAdding() ? 'Add Employee' : 'Edit Employee' }}</h2>
      <label>
        Name
        <input type="text" [formField]="editForm.name" />
      </label>
      <label>
        Department
        <input type="text" [formField]="editForm.department" />
      </label>
      <div class="modalActions">
        <button type="button" (click)="closeEdit()">Cancel</button>
        <button type="button" (click)="save()">Save</button>
      </div>
    </div>
  </div>
}
